services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: menuor-app
    restart: unless-stopped

    ports:
      - "127.0.0.1:${APP_PORT:-3030}:3030"

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}

      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://menuor.com

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./storage/uploads:/app/uploads


  ftp:
    image: stilliard/pure-ftpd:hardened
    container_name: menuor-ftp
    restart: unless-stopped

    environment:
      PUBLICHOST: "127.0.0.1"
      FTP_USER_NAME: ${FTP_USER:-menuor}
      FTP_USER_PASS: ${FTP_PASSWORD}
      FTP_USER_HOME: /home/menuor/uploads

    ports:
      - "127.0.0.1:21:21"
      - "127.0.0.1:30000-30009:30000-30009"

    volumes:
      - ./storage/uploads:/home/menuor/uploads