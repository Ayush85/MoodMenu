services:
  db:
    image: postgres:16-alpine
    container_name: moodmenu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodmenu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodmenu_prod_2026}
      POSTGRES_DB: moodmenu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodmenu"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodmenu-app
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      DATABASE_URL: postgresql://moodmenu:${POSTGRES_PASSWORD:-moodmenu_prod_2026}@db:5432/moodmenu
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-j8kL2mN4pQ6rS8tU0vW2xY4zA6bC8dE0}
      APP_BASE_URL: https://menuor.com
      NEXTAUTH_URL: https://menuor.com
      DO_SPACES_KEY: ${DO_SPACES_KEY:-}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET:-}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET:-aydexis}
      DO_SPACES_FOLDER: ${DO_SPACES_FOLDER:-menuor}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-https://sgp1.digitaloceanspaces.com}
      DO_SPACES_CDN: ${DO_SPACES_CDN:-https://aydexis.sgp1.digitaloceanspaces.com}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-menuor.com}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodmenu_prod_2026}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
