services:
  db:
    image: postgres:16-alpine
    container_name: moodmenu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moodmenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodmenu123}
      POSTGRES_DB: ${POSTGRES_DB:-moodmenu}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodmenu"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodmenu-app
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      DATABASE_URL: postgresql://moodmenu:moodmenu123@db:5432/moodmenu
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3030}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3030}
      NEXT_PUBLIC_ONESIGNAL_APP_ID: ${NEXT_PUBLIC_ONESIGNAL_APP_ID:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
